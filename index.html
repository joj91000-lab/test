    <script>
      // Ignore HMR WebSocket connection errors as specified in environment constraints
      window.addEventListener('error', function(e) {
        if (e.filename && e.filename.includes('@vite/client')) {
          e.preventDefault();
          e.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (String(e.reason).includes('WebSocket') || String(e.reason.stack).includes('@vite/client'))) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
